<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>友谊之声 Logo 预览</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f5f7; color: #222; }
  header { padding: 40px 24px 8px; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  header p { color: #666; margin: 0; }
  .row { display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; padding: 24px; }
  .card { background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 28px 24px; width: 340px; text-align: center; box-shadow: 0 2px 10px rgba(0,0,0,.05); }
  .card.dark { background: #0e1b2e; border-color: #0e1b2e; }
  .card h3 { margin: 0 0 18px; font-size: 13px; font-weight: 600; color: #999; letter-spacing: .04em; }
  .card.dark h3 { color: #8fa6c4; }
  .card img { height: 110px; width: auto; }
  .card.wide img { height: 84px; }
  footer { padding: 28px; text-align: center; color: #aaa; font-size: 13px; }
  .tip { max-width: 720px; margin: 0 auto; padding: 0 24px 8px; color: #888; font-size: 14px; line-height: 1.7; }
  .tip b { color: #1B3A6B; }
</style>
</head>
<body>
<header>
  <h1>友谊之声 · Голос Дружбы — Logo 方案</h1>
  <p>基于太极 S 形分割（呼应「友 / you」的 S），双色交融 + 声波点眼</p>
</header>
<p class="tip">
  白色 <b>S</b> 分界是视觉焦点，既表达阴阳交融（中俄双方融合），又暗合公司名「友」的拼音首字母 <b>S</b>；
  两圆点化作<b>同心声波环</b>，点出「声音 / 传播」之意；整体无棱角、圆融自然。
</p>
<div class="row">
  <div class="card"><h3>① 纯图形 mark</h3><img src="logo-mark.svg" alt="mark"></div>
  <div class="card"><h3>② 中文主名 · zh</h3><img src="logo-zh.svg" class="wide" alt="zh"></div>
  <div class="card"><h3>③ 俄文主名 · ru</h3><img src="logo-ru.svg" class="wide" alt="ru"></div>
</div>
<div class="row">
  <div class="card dark"><h3>① mark · 深色背景</h3><img src="logo-mark.svg" alt="mark"></div>
  <div class="card dark"><h3>② zh · 深色背景</h3><img src="logo-zh.svg" class="wide" alt="zh"></div>
  <div class="card dark"><h3>③ ru · 深色背景</h3><img src="logo-ru.svg" class="wide" alt="ru"></div>
</div>
<footer>矢量 SVG · 可无限缩放 · 适用于网站导航 / 名片 / 文档 / favicon</footer>
</body>
</html>
