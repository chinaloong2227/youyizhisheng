<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="友谊之声 · Голос Дружбы">
  <!-- ══════════════════════════════════════════════════════════════
       友谊之声 · 太极圆 + 微涟漪（参数化矢量母版 / 方案 F）
       ──────────────────────────────────────────────────────────────
       后期微调指南（全部为纯 SVG 属性，Illustrator / Inkscape / 浏览器通用）：
       1) 改双色：搜 #1B3A6B（蓝）与 #C9A227（金），或改 defs 里两个渐变的 stop-color
       2) 改主圆大小：R = 168，鱼形路径里的 168/336/84 与它成 1 : 2 : 0.5 倍关系
          （主圆半径 : 直径 : 鱼眼小圆半径）
       3) 改白色 S 分界粗细：stroke-width="5"（下面唯一一条白色描边）
       4) 改微涟漪：r="224"（圈大小）、stroke-dasharray="2 11"（虚线疏密）、
          opacity="0.45"（浓淡）；删掉这一个 circle 即可去掉涟漪
       5) 去眼点：删掉「上眼 / 下眼」两个 <g> 块即可
       ══════════════════════════════════════════════════════════════ -->
  <defs>
    <!-- 金鱼渐变：左下浅米金 → 右上正金（模拟选定成图的柔光过渡） -->
    <linearGradient id="gGold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#EBD9A2"/>
      <stop offset="1" stop-color="#C9A227"/>
    </linearGradient>
    <!-- 蓝鱼渐变：左上品牌蓝 → 右下深海军蓝 -->
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B3A6B"/>
      <stop offset="1" stop-color="#0D1F42"/>
    </linearGradient>
  </defs>

  <!-- 微涟漪（传播意象：一圈虚线同心波，方案 F 的点题元素） -->
  <circle cx="256" cy="256" r="224" fill="none" stroke="#C9A227"
          stroke-width="2.5" stroke-dasharray="2 11" opacity="0.45"/>

  <!-- 主圆 · 金底（太极之「阳」侧基底） -->
  <circle cx="256" cy="256" r="168" fill="url(#gGold)"/>

  <!-- 阳鱼 · 蓝：一条 S 形贝塞尔曲线分出的双鱼交融（中俄双边融合） -->
  <path d="M256,88 a168,168 0 0 1 0,336 a84,84 0 0 1 0,-168 a84,84 0 0 0 0,-168 z"
        fill="url(#gBlue)"/>

  <!-- 白色 S 分界强调：呼应「友 / you」的 S 字母，视觉焦点 -->
  <path d="M256,88 a84,84 0 0 0 0,168 a84,84 0 0 1 0,168"
        fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>

  <!-- 上眼（蓝色声波环，落于金色区域）：声音 / 传播 -->
  <g transform="translate(256,172)">
    <circle r="11" fill="#1B3A6B"/>
    <circle r="22" fill="none" stroke="#1B3A6B" stroke-width="3.5"/>
    <circle r="33" fill="none" stroke="#1B3A6B" stroke-width="2.5" opacity="0.55"/>
  </g>
  <!-- 下眼（金色声波环，落于蓝色区域） -->
  <g transform="translate(256,340)">
    <circle r="11" fill="#C9A227"/>
    <circle r="22" fill="none" stroke="#C9A227" stroke-width="3.5"/>
    <circle r="33" fill="none" stroke="#C9A227" stroke-width="2.5" opacity="0.55"/>
  </g>
</svg>
